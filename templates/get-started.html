{% extends "base.html" %}
{% block title %}Get Started — Stock Alert{% endblock %}

{% block content %}
<div class="hero">
    <h1>📈 Get Started</h1>
    <p>Enter your Gmail address to receive today's stock digest, straight to your inbox.</p>

    {% if error %}
        <p style="color:#ff6b6b; font-size:14px; margin-bottom:16px;">{{ error }}</p>
    {% endif %}

    <form action="/subscribe" method="POST" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <input
            type="email"
            name="email"
            placeholder="you@gmail.com"
            required
            style="padding:12px 16px; border-radius:8px; border:1px solid #333; background:#0a0a0a; color:#fff; font-size:14px; min-width:240px;"
        >
        <button type="submit" class="button" style="border:none; cursor:pointer; font-family:inherit;">Send My Digest</button>
    </form>
</div>
{% endblock %}
